name: Temporary AHA real-whistle search

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  hum-search:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Recover and prepare the full real whistle
        shell: bash
        run: |
          set -u
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          mkdir -p query results
          : > results/recovery-log.txt

          recover_full() {
            label="$1"; source_file="$2"; out="query/${label}.ogg"
            echo "TRY $label FROM $source_file" | tee -a results/recovery-log.txt
            base64 --decode --ignore-garbage "$source_file" > "$out" 2>>results/recovery-log.txt || true
            wc -c "$source_file" "$out" | tee -a results/recovery-log.txt
            duration="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$out" 2>>results/recovery-log.txt || true)"
            size="$(wc -c < "$out")"
            echo "DURATION=$duration SIZE=$size" | tee -a results/recovery-log.txt
            if python - "$duration" "$size" <<'PY'
          import sys
          try:
              duration=float(sys.argv[1]); size=int(sys.argv[2])
          except Exception:
              raise SystemExit(1)
          raise SystemExit(0 if duration >= 10.0 and size >= 20000 else 1)
          PY
            then
              cp "$out" query/source.ogg
              ffprobe -v error -show_entries format=duration,size -of json "$out" > "results/${label}-probe.json"
              echo "VALID FULL SOURCE: $label" | tee -a results/recovery-log.txt
              return 0
            fi
            echo "REJECTED SHORT OR INVALID SOURCE: $label" | tee -a results/recovery-log.txt
            return 1
          }

          recovered=0
          cat temporary-query/chunk_00.b64 temporary-query/chunk_01.b64 temporary-query/chunk_02.b64 temporary-query/chunk_03.b64 > query/original-chunks.b64
          recover_full original_chunks query/original-chunks.b64 && recovered=1

          if [ "$recovered" -eq 0 ] && ls temporary-query/real_chunk_*.b64 >/dev/null 2>&1; then
            cat temporary-query/real_chunk_*.b64 > query/real-chunks.b64
            recover_full real_chunks query/real-chunks.b64 && recovered=1
          fi

          if [ "$recovered" -eq 0 ]; then recover_full harmonic temporary-query/clean_harmonic.ogg.b64 && recovered=1; fi
          if [ "$recovered" -eq 0 ]; then recover_full exact temporary-query/exact_00.b64 && recovered=1; fi

          if [ "$recovered" -eq 0 ]; then
            echo 'NO VALID FULL-LENGTH AUDIO SOURCE' | tee -a results/recovery-log.txt
            exit 1
          fi

          ffprobe -v error -show_entries format=duration,size -of json query/source.ogg | tee results/source-verification.json
          set -euo pipefail
          ffmpeg -v error -y -i query/source.ogg -af 'adelay=850,apad=pad_dur=7' -t 22 -ac 1 -ar 44100 -c:a pcm_s16le query/clean.wav
          ffmpeg -v error -y -i query/source.ogg -af 'atempo=0.94,adelay=850,apad=pad_dur=7' -t 22 -ac 1 -ar 44100 -c:a pcm_s16le query/slower.wav
          ffmpeg -v error -y -i query/source.ogg -af 'atempo=1.06,adelay=850,apad=pad_dur=7' -t 22 -ac 1 -ar 44100 -c:a pcm_s16le query/faster.wav
          for f in query/*.wav; do ffprobe -v error -show_entries format=duration,size -of compact "$f"; done | tee results/query-info.txt

      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null
          npm install --silent playwright
          npx playwright install --with-deps chromium

      - name: Submit the real whistle to AHA Hum mode
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/aha-real.js <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');
          const variants = ['clean','slower','faster'];
          const origin = 'https://www.doreso.com';
          fs.mkdirSync('results',{recursive:true});
          async function one(name) {
            const dir=`results/${name}`; fs.mkdirSync(dir,{recursive:true});
            const browser=await chromium.launch({headless:true,args:[
              '--use-fake-ui-for-media-stream','--use-fake-device-for-media-stream',
              `--use-file-for-fake-audio-capture=${path.resolve(`query/${name}.wav`)}`,
              '--autoplay-policy=no-user-gesture-required','--disable-blink-features=AutomationControlled','--no-sandbox'
            ]});
            const context=await browser.newContext({viewport:{width:1440,height:1100},locale:'en-US',userAgent:'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/150 Safari/537.36'});
            await context.grantPermissions(['microphone'],{origin});
            const page=await context.newPage(), log=[];
            page.on('console',m=>log.push({kind:'console',type:m.type(),text:m.text()}));
            page.on('pageerror',e=>log.push({kind:'pageerror',text:String(e)}));
            page.on('request',r=>{if(/api|hum|record|recogn|audio|upload|acr/i.test(r.url()))log.push({kind:'request',method:r.method(),url:r.url(),post:(r.postData()||'').slice(0,5000)})});
            page.on('response',async r=>{if(/api|hum|record|recogn|audio|upload|acr/i.test(r.url())){let body='';try{const ct=r.headers()['content-type']||'';if(/json|text/i.test(ct))body=(await r.text()).slice(0,60000)}catch(_){}log.push({kind:'response',status:r.status(),url:r.url(),body})}});
            try {
              await page.goto(origin+'/',{waitUntil:'networkidle',timeout:90000});
              await page.waitForTimeout(2200);
              await page.getByRole('tab',{name:/HUM\/SING/i}).click({force:true});
              await page.waitForTimeout(700);
              log.push({kind:'mode-selected',selected:await page.getByRole('tab',{name:/HUM\/SING/i}).getAttribute('aria-selected')});
              await page.locator('.rf-idle__ring').click({force:true,position:{x:52,y:52}});
              log.push({kind:'microphone-clicked'});
              await page.waitForTimeout(1200);
              for(let i=0;i<28;i++) {
                await page.waitForTimeout(1500);
                const text=await page.locator('body').innerText();
                const html=await page.locator('section.app-area').innerHTML().catch(()=> '');
                log.push({kind:'state',sec:(i+1)*1.5,text:text.slice(0,14000),app:html.slice(0,18000)});
                if(i%5===4) await page.screenshot({path:`${dir}/state-${String(i+1).padStart(2,'0')}.png`,fullPage:true});
              }
              fs.writeFileSync(`${dir}/final.txt`,await page.locator('body').innerText());
              fs.writeFileSync(`${dir}/final.html`,await page.content());
              await page.screenshot({path:`${dir}/final.png`,fullPage:true});
            } catch(e) {log.push({kind:'fatal',text:String(e),stack:e.stack});try{await page.screenshot({path:`${dir}/fatal.png`,fullPage:true})}catch(_){} }
            fs.writeFileSync(`${dir}/events.json`,JSON.stringify(log,null,2));
            await context.close(); await browser.close();
          }
          (async()=>{for(const v of variants)await one(v)})().catch(e=>{console.error(e);process.exit(1)});
          JS
          NODE_PATH="$PWD/node_modules" node /tmp/aha-real.js | tee results/node.log

      - name: Upload real-whistle recognition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aha-real-whistle-full-results
          path: results
          retention-days: 1
