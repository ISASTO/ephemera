name: Temporary recent-history fast ranking

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: read

jobs:
  rank:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download isolated vocal corpus
        run: gh run download 29365991093 --repo "$GITHUB_REPOSITORY" --name recent-history-vocals --dir corpus
      - name: Install dependencies
        run: pip install --quiet numpy librosa soundfile
      - name: Rank full and partial motifs by vocal chroma
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results top-stems
          python - <<'PY'
          import json,pathlib,shutil
          import numpy as np,librosa
          q=np.array([85,83.5,90,93,85,83.5,90.5,93,85,83.5,91.5,90.5,91.5,90.5,88.0])
          qt=np.array([0,.68,1.39,1.83,2.41,3.11,3.80,4.19,4.73,5.43,6.30,6.51,7.20,7.62,7.84])
          variants={'full':(q,qt),'two_cycles':(q[:8],qt[:8]),'one_cycle':(q[:4],qt[:4]),'cycle_plus_third':(q[:11],qt[:11]),'closing_tag':(q[11:],qt[11:]-qt[11]),'second_through_tag':(q[4:],qt[4:]-qt[4])}
          def score(C,fps,qq,qtt):
            pcs=(qq%12).astype(int);best=None
            for scale in np.arange(.76,1.281,.04):
              rel=np.rint(qtt*scale*fps).astype(int);starts=np.arange(0,max(0,C.shape[1]-rel[-1]-1),2)
              if not len(starts):continue
              cols=starts[:,None]+rel
              for tr in range(12):
                vals=C[((pcs+tr)%12)[None,:],cols];mean=vals.mean(1);floor=np.percentile(vals,20,axis=1);s=1-(.8*mean+.2*floor);k=int(np.argmin(s))
                rec={'score':float(s[k]),'start':float(starts[k]/fps),'scale':float(scale),'transpose':int(tr),'values':vals[k].tolist()}
                if best is None or rec['score']<best['score']:best=rec
            return best or {'score':999}
          cat=json.loads(next(pathlib.Path('corpus').rglob('catalog.json')).read_text());by={pathlib.Path(x['filename']).stem:x for x in cat};rows=[]
          stems=list(pathlib.Path('corpus').rglob('*-vocals.wav'));print('STEMS',len(stems))
          for i,p in enumerate(stems,1):
            y,sr=librosa.load(p,sr=8000,mono=True);hop=256;C=librosa.feature.chroma_stft(y=y,sr=sr,n_fft=1024,hop_length=hop,n_chroma=12);C=C/(C.sum(0,keepdims=True)+1e-8);fps=sr/hop
            matches={k:score(C,fps,*v) for k,v in variants.items()};key=p.name[:-len('-vocals.wav')];m=by.get(key,{})
            row={'artist':m.get('artist'),'title':m.get('title'),'filename':p.name,'track_id':m.get('track_id'),'preview_url':m.get('preview_url'),'matches':matches,'full_score':matches['full']['score']}
            row['best_partial']=min((k for k in matches if k!='full'),key=lambda k:matches[k]['score']);row['partial_score']=matches[row['best_partial']]['score'];rows.append(row)
            print(i,row['full_score'],row['partial_score'],row['best_partial'],row['artist'],row['title'])
          rows.sort(key=lambda r:min(r['full_score'],r['partial_score']));pathlib.Path('results/rankings.json').write_text(json.dumps(rows,indent=2,ensure_ascii=False))
          pathlib.Path('results/top.tsv').write_text('\n'.join(f"{r['full_score']:.5f}\t{r['partial_score']:.5f}\t{r['best_partial']}\t{r.get('artist')}\t{r.get('title')}\t{r['filename']}" for r in rows))
          for r in rows[:30]:shutil.copy2(next(pathlib.Path('corpus').rglob(r['filename'])),pathlib.Path('top-stems')/r['filename'])
          print(pathlib.Path('results/top.tsv').read_text()[:12000])
          PY
      - name: Upload fast rankings
        uses: actions/upload-artifact@v4
        with:
          name: recent-history-fast-results
          path: |
            results
            top-stems
          retention-days: 1
