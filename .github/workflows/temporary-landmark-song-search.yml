name: Temporary strict broad-candidate verification A

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install --quiet requests numpy scipy librosa demucs soundfile
      - name: Recover query and candidate previews
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p query work/audio work/results
          for n in 00 01 02 03; do
            curl -fL --retry 4 -o "query/chunk_${n}.b64" "https://raw.githubusercontent.com/ISASTO/ephemera/temporary-playlist-melody-corpus/temporary-query/chunk_${n}.b64"
          done
          cat query/chunk_*.b64 > query/full.b64
          base64 --decode --ignore-garbage query/full.b64 > query/clean.ogg || true
          python - <<'PY'
          import json,pathlib,re,requests
          targets=[
            ('Mazzy Star','Common Burn (Mixed)'),('Warpaint','Set Your Arms Down'),('Crumb','Up & Down'),
            ('Billie Eilish','WHEN I WAS OLDER (Music Inspired By The Film ROMA)'),('Weyes Blood','Open Heart'),
            ('anna luna','Mediterraneo'),('FKA twigs','24hr Dog'),('yeule','bloodbunny'),
            ('Brothel in Belize','obsession'),('Mitski',"I'm a Fool to Want You"),
            ('Purity Ring','glacier - in memory of RS'),('Blondshell','Kiss City - Home Demo'),
            ('Chromatics',"There's a Light Out on the Horizon"),('Caroline Polachek','Welcome To My Island'),
            ('Still Corners','Parallels'),('Soccer Mommy','Gray Light (Demo)'),('Billie Eilish','i love you'),
            ('Japanese Breakfast','The Wash Day'),('Chromatics','Shining Violence'),
            ('Chromatics','The River'),('Eartheater','Bringing Me Back'),('Caroline Polachek','Parachute'),
            ('Beach House','Tokyo Witch'),('Weyes Blood','Movies'),('Mazzy Star',"I'm Less Here")]
          s=requests.Session();s.headers['User-Agent']='Mozilla/5.0 Chrome/150 Safari/537.36'
          norm=lambda x:re.sub(r'[^a-z0-9]+',' ',(x or '').casefold()).strip()
          slug=lambda x:re.sub(r'[^a-z0-9]+','-',x.casefold()).strip('-')
          rows=[]
          for artist,title in targets:
            d=s.get('https://itunes.apple.com/search',params={'term':f'{artist} {title}','entity':'song','limit':100,'country':'US'},timeout=45).json()
            xs=[x for x in d.get('results',[]) if norm(x.get('artistName'))==norm(artist) and norm(x.get('trackName'))==norm(title) and x.get('previewUrl')]
            if not xs:
              xs=[x for x in d.get('results',[]) if norm(artist) in norm(x.get('artistName')) and (norm(title) in norm(x.get('trackName')) or norm(x.get('trackName')) in norm(title)) and x.get('previewUrl')]
            if not xs:
              print('MISS',artist,title);continue
            x=xs[0];fn=f'{slug(artist)}__{slug(title)}.m4a';r=s.get(x['previewUrl'],timeout=60);r.raise_for_status();pathlib.Path('work/audio',fn).write_bytes(r.content)
            rows.append({'artist':artist,'title':title,'filename':fn,'preview_url':x['previewUrl'],'resolved_title':x.get('trackName')})
          pathlib.Path('work/results/downloaded.json').write_text(json.dumps(rows,indent=2))
          print('DOWNLOADED',len(rows))
          PY
      - name: Separate vocals
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/wavs
          for f in work/audio/*.m4a; do b="$(basename "$f" .m4a)"; ffmpeg -v error -y -i "$f" -ar 44100 -ac 2 "work/wavs/${b}.wav"; done
          python -m demucs --two-stems=vocals -n htdemucs -j 2 -o work/separated work/wavs/*.wav
      - name: Enforce four repeated vocal jumps
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib,numpy as np,librosa
          from scipy import signal
          rows=json.loads(pathlib.Path('work/results/downloaded.json').read_text())
          low_t=np.array([1.82,4.20,6.28,8.68]); high_t=np.array([2.48,4.78,7.12,9.30]); reset_t=np.array([2.78,5.12,7.48]); expected=np.array([7.8,9.3,9.2,8.2])
          def track(path):
            y,sr=librosa.load(path,sr=12000,mono=True); y=signal.sosfiltfilt(signal.butter(4,[120,2200],btype='bandpass',fs=sr,output='sos'),y); y=librosa.effects.harmonic(y,margin=2.0)
            f0,_,prob=librosa.pyin(y,fmin=librosa.note_to_hz('A2'),fmax=librosa.note_to_hz('C6'),sr=sr,frame_length=2048,hop_length=240,fill_na=np.nan)
            m=librosa.hz_to_midi(f0);t=librosa.times_like(m,sr=sr,hop_length=240);m[prob<.48]=np.nan;return t,m
          def sample(t,m,x):
            return np.array([float(np.nanmedian(m[(t>=z-.12)&(t<=z+.12)&np.isfinite(m)])) if ((t>=z-.12)&(t<=z+.12)&np.isfinite(m)).sum() else np.nan for z in x])
          out=[]
          for r in rows:
            v=pathlib.Path('work/separated/htdemucs')/pathlib.Path(r['filename']).stem/'vocals.wav';best=None
            if not v.exists():continue
            t,m=track(v)
            for scale in np.arange(.72,1.36,.025):
              for start in np.arange(0,max(.01,t[-1]-9.5*scale),.05):
                lows=sample(t,m,start+low_t*scale);highs=sample(t,m,start+high_t*scale);resets=sample(t,m,start+reset_t*scale);jumps=highs-lows;available=np.isfinite(jumps)
                if available.sum()<3:continue
                good=(jumps>=5.5)&(jumps<=12.5)&available
                if good.sum()<3:continue
                drops=highs[:3]-resets;rg=np.isfinite(drops)
                if rg.sum()<2 or np.sum(drops[rg]>=4.5)<2:continue
                jerr=float(np.mean(np.abs(jumps[available]-expected[available])));score=jerr+.35*float(np.std(jumps[available]-expected[available]))+.55*float(np.mean(np.maximum(0,5.5-drops[rg])))+2*(1-float(available.mean()))+.8*(4-int(good.sum()))
                rec={'score':score,'start':float(start),'scale':float(scale),'jumps':[None if not np.isfinite(x) else float(x) for x in jumps],'reset_drops':[None if not np.isfinite(x) else float(x) for x in drops],'coverage':float(available.mean()),'good_jumps':int(good.sum())}
                if best is None or score<best['score']:best=rec
            out.append({**r,'landmark':best or {'score':999,'good_jumps':0}})
          out.sort(key=lambda x:x['landmark']['score']);pathlib.Path('work/results/landmark_rankings.json').write_text(json.dumps(out,indent=2));pathlib.Path('work/results/landmark_rankings.tsv').write_text('\n'.join(f"{x['landmark']['score']:.4f}\t{x['landmark']['good_jumps']}\t{x['artist']}\t{x['title']}\t{x['landmark'].get('jumps')}\t{x['landmark'].get('reset_drops')}\tstart={x['landmark'].get('start')}\tscale={x['landmark'].get('scale')}" for x in out));print(pathlib.Path('work/results/landmark_rankings.tsv').read_text())
          PY
      - name: Upload strict results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strict-broad-a-results
          path: work/results
          retention-days: 2
