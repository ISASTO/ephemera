name: Temporary Spotify playlist ingestion debug

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public Spotify playlist surfaces
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p debug
          python - <<'PY'
          import json, pathlib, re, requests
          pid='0KYyZmo05ynpxxWOhiaNUI'
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/150 Safari/537.36','Accept-Language':'en-US,en;q=0.9'})
          urls={
            'home':'https://open.spotify.com/',
            'playlist':f'https://open.spotify.com/playlist/{pid}',
            'embed':f'https://open.spotify.com/embed/playlist/{pid}',
            'token':'https://open.spotify.com/get_access_token?reason=transport&productType=web_player',
            'oembed':f'https://open.spotify.com/oembed?url=https://open.spotify.com/playlist/{pid}',
          }
          summary={}
          for name,u in urls.items():
            try:
              r=s.get(u,timeout=45,allow_redirects=True)
              summary[name]={'status':r.status_code,'url':r.url,'headers':dict(r.headers),'length':len(r.content),'content_type':r.headers.get('content-type')}
              suffix='json' if 'json' in (r.headers.get('content-type') or '') else 'html'
              pathlib.Path(f'debug/{name}.{suffix}').write_bytes(r.content)
              print(name,r.status_code,len(r.content),r.url,r.headers.get('content-type'))
            except Exception as e:
              summary[name]={'error':repr(e)}; print(name,'ERROR',repr(e))
          # Search playlist/embed HTML for likely hydration blobs and track-like structures.
          for name in ('playlist','embed'):
            p=pathlib.Path(f'debug/{name}.html')
            if not p.exists(): continue
            text=p.read_text(errors='ignore')
            findings={
              'script_srcs':re.findall(r'<script[^>]+src=["\']([^"\']+)',text),
              'json_script_ids':re.findall(r'<script[^>]+(?:id|data-testid)=["\']([^"\']+)["\'][^>]*type=["\']application/(?:ld\+)?json["\']',text,re.I),
              'spotify_uris':list(dict.fromkeys(re.findall(r'spotify:track:[A-Za-z0-9]+',text)))[:100],
              'track_urls':list(dict.fromkeys(re.findall(r'https://open\.spotify\.com/track/[A-Za-z0-9]+',text)))[:100],
              'keywords':{k:text.find(k) for k in ['__NEXT_DATA__','initialState','initial-state','hydration','playlistV2','fetchPlaylist','trackList','entityUniqueId','pageProps','Spotify.Entity']},
            }
            pathlib.Path(f'debug/{name}-findings.json').write_text(json.dumps(findings,indent=2),encoding='utf-8')
            # Save compact contexts around useful keywords.
            contexts=[]
            for key,pos in findings['keywords'].items():
              if pos>=0: contexts.append(f'\n===== {key} @ {pos} =====\n'+text[max(0,pos-1000):pos+5000])
            pathlib.Path(f'debug/{name}-contexts.txt').write_text('\n'.join(contexts),encoding='utf-8')
          pathlib.Path('debug/summary.json').write_text(json.dumps(summary,indent=2),encoding='utf-8')
          PY
          find debug -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
      - name: Upload debug responses
        uses: actions/upload-artifact@v4
        with:
          name: spotify-playlist-ingestion-debug
          path: debug
          retention-days: 1
