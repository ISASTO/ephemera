name: Temporary AHA actual-audio search

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  recognize:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and verify exact cleaned whistle
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          mkdir -p work variants results
          cat query/00.b64 query/01.b64 query/02.b64 query/03.b64 query/04.b64 query/05.b64 query/06.b64 > work/clean.b64
          test "$(wc -c < work/clean.b64)" -eq 31448
          base64 -d work/clean.b64 > work/clean.ogg
          echo '3ca25bed926585c470eddae3706d01d4d69d0f9152a0fb077889aebb62c0ecf2  work/clean.ogg' | sha256sum -c -
          ffprobe -v error -show_entries format=duration,size -of json work/clean.ogg | tee results/source-verification.json

      - name: Build overlapping microphone WAV variants
        shell: bash
        run: |
          set -euo pipefail
          # AHA records roughly ten seconds after the click, so overlapping windows ensure every remembered phrase is tested.
          ffmpeg -v error -y -i work/clean.ogg -af 'adelay=500,apad=pad_dur=3' -t 14 -ac 1 -ar 44100 -c:a pcm_s16le variants/original.wav
          ffmpeg -v error -y -i work/clean.ogg -af 'atempo=1.18,adelay=500,apad=pad_dur=3' -t 13 -ac 1 -ar 44100 -c:a pcm_s16le variants/fullfast.wav
          ffmpeg -v error -y -ss 0 -t 9.3 -i work/clean.ogg -af 'adelay=500,apad=pad_dur=3' -t 13 -ac 1 -ar 44100 -c:a pcm_s16le variants/first.wav
          ffmpeg -v error -y -ss 1.3 -t 9.4 -i work/clean.ogg -af 'adelay=500,apad=pad_dur=3' -t 13 -ac 1 -ar 44100 -c:a pcm_s16le variants/middle.wav
          ffmpeg -v error -y -ss 2.2 -i work/clean.ogg -af 'adelay=500,apad=pad_dur=3' -t 13 -ac 1 -ar 44100 -c:a pcm_s16le variants/last.wav
          ffmpeg -v error -y -i work/clean.ogg -af 'atempo=1.18,asetrate=44100*0.890899,aresample=44100,atempo=1.122462,adelay=500,apad=pad_dur=3' -t 13 -ac 1 -ar 44100 -c:a pcm_s16le variants/down2.wav
          ffmpeg -v error -y -i work/clean.ogg -af 'atempo=1.18,asetrate=44100*1.122462,aresample=44100,atempo=0.890899,adelay=500,apad=pad_dur=3' -t 13 -ac 1 -ar 44100 -c:a pcm_s16le variants/up2.wav
          for f in variants/*.wav; do ffprobe -v error -show_entries format=filename,duration,size -of compact "$f"; done | sort | tee results/variant-verification.txt

      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null
          npm install --silent playwright
          npx playwright install --with-deps chromium

      - name: Submit actual whistle through Chrome MediaRecorder
        shell: bash
        run: |
          set -euo pipefail
          cat > run-actual.js <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');
          const variants = ['original','fullfast','first','middle','last','down2','up2'];
          const summary = [];

          async function recognize(name) {
            const wav = path.resolve(`variants/${name}.wav`);
            const browser = await chromium.launch({headless:true,args:[
              '--use-fake-ui-for-media-stream','--use-fake-device-for-media-stream',
              `--use-file-for-fake-audio-capture=${wav}`,
              '--autoplay-policy=no-user-gesture-required','--disable-blink-features=AutomationControlled','--no-sandbox'
            ]});
            const context = await browser.newContext({viewport:{width:1300,height:900},locale:'en-US'});
            await context.grantPermissions(['microphone'],{origin:'https://www.doreso.com'});
            const page = await context.newPage();
            const record = {variant:name};
            const network = [];
            page.on('request',r=>{if(r.url().endsWith('/humming'))network.push({kind:'request',method:r.method(),bytes:(r.postData()||'').length})});
            try {
              await page.goto('https://www.doreso.com/',{waitUntil:'networkidle',timeout:90000});
              await page.getByRole('tab',{name:/HUM\/SING/i}).click({force:true});
              await page.waitForTimeout(600);
              const responsePromise = page.waitForResponse(r=>r.url().endsWith('/humming') && r.request().method()==='POST',{timeout:35000});
              await page.locator('.rf-idle__ring').click({force:true,position:{x:52,y:52}});
              const response = await responsePromise;
              record.http_status = response.status();
              const text = await response.text();
              record.raw_body = text;
              try {
                const body = JSON.parse(text);
                record.response = body;
                const d = body && body.data;
                if (d) {
                  record.title=d.title;
                  record.artists=(d.artists||[]).map(a=>a.name);
                  record.score=d.score;
                  record.release_date=d.release_date;
                  record.play_offset_ms=d.play_offset_ms;
                  record.duration_ms=d.duration_ms;
                  record.isrc=d.external_ids && d.external_ids.isrc;
                  record.acrid=d.acrid;
                  record.result_from=d.result_from;
                }
              } catch (_) {}
              await page.waitForTimeout(800);
              fs.writeFileSync(`results/${name}-body.txt`,await page.locator('body').innerText());
            } catch(e) {
              record.error=String(e);
              try { fs.writeFileSync(`results/${name}-body.txt`,await page.locator('body').innerText()); } catch(_) {}
            }
            record.network=network;
            summary.push(record);
            console.log(JSON.stringify({variant:name,title:record.title,artists:record.artists,score:record.score,http_status:record.http_status,error:record.error}));
            await browser.close();
          }

          (async()=>{
            for(const v of variants) await recognize(v);
            fs.writeFileSync('results/responses.json',JSON.stringify(summary,null,2));
            fs.writeFileSync('results/summary.tsv',summary.map(r=>`${r.variant}\t${r.score??''}\t${(r.artists||[]).join(',')}\t${r.title||''}\t${r.release_date||''}\t${r.play_offset_ms??''}\t${r.http_status??''}\t${r.error||''}`).join('\n'));
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          NODE_PATH="$PWD/node_modules" node run-actual.js | tee results/console-results.txt
          cat results/summary.tsv

      - name: Upload actual-whistle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aha-actual-browser-results
          path: results
          retention-days: 1
