          EOF
          while IFS=$'\t' read -r name url; do
            curl -fL --retry 3 -o "previews/${name}.mp3" "$url"
          done < candidates.tsv
          ls -lh previews
      - name: Install Demucs
        run: pip install --quiet numpy demucs
      - name: Isolate vocals
        shell: bash
        run: |
          set -euo pipefail
          python -m demucs --two-stems=vocals -o separated previews/*.mp3
          mkdir vocal-stems
          find separated -type f -name vocals.wav -print0 | while IFS= read -r -d '' file; do
            track="$(basename "$(dirname "$file")")"
            cp "$file" "vocal-stems/${track}-vocals.wav"
          done
          ls -lh vocal-stems
      - name: Upload vocals and previews
        uses: actions/upload-artifact@v4
        with:
          name: adjacent-tempo-vocals
          path: |
            vocal-stems/*.wav
            previews/*.mp3
            candidates.tsv
          retention-days: 1
