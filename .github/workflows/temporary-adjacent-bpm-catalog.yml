name: Temporary adjacent BPM catalog

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Query adjacent-artist catalogs and BPM
        shell: bash
        run: |
          set -euo pipefail
          mkdir results
          python - <<'PY'
          import json, pathlib, time, urllib.parse, urllib.request

          artists = [
              'Cults', 'Beach House', 'Men I Trust', 'Magdalena Bay',
              'Night Tapes', 'Slow Pulp', 'Crumb', 'Yumi Zouma', 'TOPS',
              'Fazerdaze', 'Wolf Alice', 'The Japanese House',
              'Purity Ring', 'Weyes Blood', 'Blondshell', 'Momma'
          ]

          def get(url, attempts=5):
              for attempt in range(attempts):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0 melody-research/1.0'})
                      with urllib.request.urlopen(req, timeout=30) as r:
                          data = json.load(r)
                      if isinstance(data, dict) and data.get('error'):
                          raise RuntimeError(data['error'])
                      return data
                  except Exception as e:
                      if attempt == attempts - 1:
                          print('FAILED', url, repr(e))
                          return None
                      time.sleep(1.5 * (attempt + 1))

          all_rows=[]
          for artist_name in artists:
              q=urllib.parse.quote(f'artist:"{artist_name}"')
              search=get(f'https://api.deezer.com/search/artist?q={q}&limit=25') or {}
              exact=[a for a in search.get('data',[]) if a.get('name','').casefold()==artist_name.casefold()]
              if not exact:
                  print('NO EXACT ARTIST',artist_name)
                  continue
              artist=exact[0]
              aid=artist['id']
              tracks=get(f'https://api.deezer.com/artist/{aid}/top?limit=100') or {}
              seen=set(); kept=0
              for item in tracks.get('data',[]):
                  title=item.get('title_short') or item.get('title')
                  if not title or title.casefold() in seen:
                      continue
                  seen.add(title.casefold())
                  detail=get(f"https://api.deezer.com/track/{item['id']}") or {}
                  bpm=detail.get('bpm') or 0
                  if not bpm:
                      continue
                  normalized=float(bpm)
                  while normalized > 160: normalized /= 2
                  while normalized < 70: normalized *= 2
                  album=detail.get('album') or {}
                  album_detail=get(f"https://api.deezer.com/album/{album.get('id')}") if album.get('id') else {}
                  album_detail=album_detail or {}
                  release=album_detail.get('release_date')
                  year=int(release[:4]) if release and release[:4].isdigit() else None
                  row={
                      'artist':artist_name,
                      'artist_id':aid,
                      'title':title,
                      'track_id':detail.get('id'),
                      'bpm':float(bpm),
                      'normalized_bpm':normalized,
                      'duration':detail.get('duration'),
                      'rank':detail.get('rank'),
                      'preview':detail.get('preview'),
                      'album':album.get('title'),
                      'release_date':release,
                      'year':year,
                      'link':detail.get('link')
                  }
                  all_rows.append(row)
                  if 94 <= normalized <= 119 and (year is None or year >= 2009) and row['preview']:
                      kept += 1
                  time.sleep(0.04)
              print(artist_name, 'tracks', len(seen), 'tempo-window', kept)

          shortlist=[r for r in all_rows if 94 <= r['normalized_bpm'] <= 119 and (r['year'] is None or r['year'] >= 2009) and r['preview']]
          shortlist.sort(key=lambda r:(abs(r['normalized_bpm']-105.14), -(r['rank'] or 0)))
          pathlib.Path('results/all-tracks.json').write_text(json.dumps(all_rows,indent=2,ensure_ascii=False),encoding='utf-8')
          pathlib.Path('results/shortlist.json').write_text(json.dumps(shortlist,indent=2,ensure_ascii=False),encoding='utf-8')
          lines=[f"{r['artist']}\t{r['title']}\t{r['bpm']:.2f}\t{r['normalized_bpm']:.2f}\t{r['release_date']}\t{r['preview']}" for r in shortlist]
          pathlib.Path('results/shortlist.tsv').write_text('\n'.join(lines),encoding='utf-8')
          print('TOTAL SHORTLIST',len(shortlist))
          print('\n'.join(lines[:100]))
          PY
      - name: Upload catalog results
        uses: actions/upload-artifact@v4
        with:
          name: adjacent-bpm-catalog
          path: results
          retention-days: 1
