name: Temporary secondary adjacent catalog fetch

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact-artist Apple catalogs and previews
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p previews catalogs
          python - <<'PY'
          import json, pathlib, re, time, urllib.parse, urllib.request

          artists = [
              'Night Tapes', 'Slow Pulp', 'Crumb', 'TOPS', 'Fazerdaze',
              'Blondshell', 'Momma', 'Alvvays', 'Big Thief', 'boygenius',
              'Mitski', 'Phantogram', 'CHVRCHES', 'Grimes', 'Warpaint',
              'Still Corners', 'Snail Mail', 'Soccer Mommy', 'Yeah Yeah Yeahs'
          ]

          def fetch_json(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 melody-research/1.0'})
              with urllib.request.urlopen(req,timeout=45) as r:
                  return json.load(r)

          metadata=[]
          for artist in artists:
              params=urllib.parse.urlencode({'term':artist,'entity':'song','limit':200,'country':'US'})
              data=fetch_json('https://itunes.apple.com/search?'+params)
              artist_slug=re.sub(r'[^a-z0-9]+','-',artist.casefold()).strip('-')
              pathlib.Path('catalogs',artist_slug+'.json').write_text(
                  json.dumps(data,indent=2,ensure_ascii=False),encoding='utf-8')
              rows=[]; seen=set()
              for r in data.get('results',[]):
                  if r.get('artistName','').casefold()!=artist.casefold():
                      continue
                  title=r.get('trackName') or 'untitled'
                  key=title.casefold()
                  if key in seen or not r.get('previewUrl'):
                      continue
                  seen.add(key); rows.append(r)
              print(artist,len(rows),'unique previews')
              for r in rows:
                  title=r.get('trackName') or 'untitled'
                  slug=re.sub(r'[^a-z0-9]+','-',title.casefold()).strip('-')[:80]
                  tid=str(r.get('trackId','unknown'))
                  filename=f'{artist_slug}__{tid}__{slug}.m4a'
                  path=pathlib.Path('previews')/filename
                  try:
                      req=urllib.request.Request(r['previewUrl'],headers={'User-Agent':'Mozilla/5.0'})
                      with urllib.request.urlopen(req,timeout=45) as src, open(path,'wb') as dst:
                          dst.write(src.read())
                      metadata.append({
                          'artist':artist,'title':title,'track_id':tid,'filename':filename,
                          'preview_url':r['previewUrl'],'collection':r.get('collectionName'),
                          'release_date':r.get('releaseDate')
                      })
                  except Exception as e:
                      print('FAILED',artist,title,repr(e))
                  time.sleep(0.025)
          pathlib.Path('metadata.json').write_text(json.dumps(metadata,indent=2,ensure_ascii=False),encoding='utf-8')
          print('TOTAL DOWNLOADED',len(metadata))
          PY
          du -sh previews
      - name: Upload secondary adjacent catalogs
        uses: actions/upload-artifact@v4
        with:
          name: secondary-adjacent-catalog-previews
          path: |
            previews
            catalogs
            metadata.json
          retention-days: 1
