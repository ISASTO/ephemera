name: Temporary full catalog preview fetch

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download exact-artist Apple previews
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p catalog previews
          curl -fsSLG 'https://itunes.apple.com/search' --data-urlencode 'term=Pearly Drops' --data 'entity=song' --data 'limit=200' > catalog/pearly-drops.json
          curl -fsSLG 'https://itunes.apple.com/search' --data-urlencode 'term=NewDad' --data 'entity=song' --data 'limit=200' > catalog/newdad.json
          python - <<'PY'
          import json, pathlib, re, urllib.request, time
          metadata=[]
          for artist,fn in [('Pearly Drops','catalog/pearly-drops.json'),('NewDad','catalog/newdad.json')]:
              data=json.load(open(fn))
              seen=set()
              for r in data.get('results',[]):
                  if r.get('artistName','').casefold()!=artist.casefold(): continue
                  title=r.get('trackName') or 'untitled'
                  if title in seen: continue
                  seen.add(title)
                  url=r.get('previewUrl')
                  if not url: continue
                  slug=re.sub(r'[^a-z0-9]+','-',title.casefold()).strip('-')[:80]
                  track_id=str(r.get('trackId','unknown'))
                  ext='.m4a'
                  filename=f"{artist.casefold().replace(' ','-')}__{track_id}__{slug}{ext}"
                  path=pathlib.Path('previews')/filename
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                      with urllib.request.urlopen(req,timeout=30) as src, open(path,'wb') as dst:
                          dst.write(src.read())
                      metadata.append({'artist':artist,'title':title,'track_id':track_id,'filename':filename,'preview_url':url,'collection':r.get('collectionName'),'release_date':r.get('releaseDate')})
                      print(artist, title, path.stat().st_size)
                  except Exception as e:
                      print('FAILED',artist,title,repr(e))
                  time.sleep(0.05)
          pathlib.Path('metadata.json').write_text(json.dumps(metadata,indent=2,ensure_ascii=False),encoding='utf-8')
          print('downloaded',len(metadata),'previews')
          PY
          du -sh previews
      - name: Upload complete preview batch
        uses: actions/upload-artifact@v4
        with:
          name: full-reference-catalog-previews
          path: |
            previews
            metadata.json
          retention-days: 1
