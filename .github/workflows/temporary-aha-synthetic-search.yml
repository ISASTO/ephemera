name: Temporary AHA synthetic hum search

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Generate whistle waveforms from measured recording
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install --quiet numpy
          mkdir -p query results
          cat > /tmp/synth.py <<'PY'
          import wave
          import numpy as np
          anchors=np.array([
            [0.00,83.2],[0.14,84.1],[0.28,84.8],[0.50,85.5],
            [1.05,85.0],[1.55,85.1],[2.00,85.0],[2.48,89.2],[2.64,90.0],[2.95,93.0],
            [3.38,85.1],[4.10,85.1],[4.98,85.0],[5.15,83.8],[5.32,83.1],[6.10,83.3],
            [6.23,89.5],[6.37,90.1],[6.58,91.9],[6.90,92.7],
            [7.38,85.6],[8.10,85.0],[8.98,84.5],[9.15,83.3],[10.23,83.3],
            [10.37,90.3],[10.62,90.8],[10.98,92.8],
            [11.26,84.9],[12.10,85.1],[12.98,84.8],[13.15,83.7],[14.10,83.4],
            [14.25,90.3],[14.48,91.4],[14.72,92.7],[14.92,91.0],[15.15,90.5],[15.58,90.2],
            [16.25,90.9],[16.52,91.3],[16.68,92.5],[16.98,90.7],[17.28,90.3],[17.52,87.9]
          ],float)
          def render(name, semitones=0.0, tempo=1.0):
            sr=44100; ta=0.55+anchors[:,0]*tempo; duration=min(17.5,ta[-1]+1.0)
            t=np.arange(int(duration*sr))/sr
            midi=np.interp(t,ta,anchors[:,1]+semitones,left=anchors[0,1]+semitones,right=anchors[-1,1]+semitones)
            freq=440*2**((midi-69)/12); phase=2*np.pi*np.cumsum(freq*(1+.0025*np.sin(2*np.pi*5.2*t)))/sr
            y=.56*np.sin(phase)+.16*np.sin(2*phase+.2)+.055*np.sin(3*phase+.7)
            env=np.clip((t-.45)/.10,0,1)*np.clip((duration-t)/.30,0,1)
            for center in [3.80,7.80,11.70,14.70]: env*=1-.45*np.exp(-.5*((t-(.55+center*tempo))/.055)**2)
            y=np.tanh(1.15*(y*env+.004*np.random.default_rng(4).normal(size=len(t))*env))
            with wave.open(f'query/{name}.wav','wb') as w:
              w.setnchannels(1);w.setsampwidth(2);w.setframerate(sr);w.writeframes(np.int16(np.clip(y,-1,1)*32767).tobytes())
          render('base',0,.78);render('lower3',-3,.78);render('upper3',3,.78);render('slower',0,.88)
          PY
          python /tmp/synth.py
          for f in query/*.wav; do ffprobe -v error -show_entries format=duration,size -of compact "$f"; done | tee results/query-info.txt

      - name: Install browser
        run: |
          npm init -y >/dev/null
          npm install --silent playwright
          npx playwright install --with-deps chromium

      - name: Use AHA humming recognition
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/run.js <<'JS'
          const { chromium } = require('playwright');
          const fs=require('fs'), path=require('path');
          const variants=['base','lower3','upper3','slower'];
          fs.mkdirSync('results',{recursive:true});
          async function one(name){
            const dir=`results/${name}`;fs.mkdirSync(dir,{recursive:true});
            const browser=await chromium.launch({headless:true,args:[
              '--use-fake-ui-for-media-stream','--use-fake-device-for-media-stream',
              `--use-file-for-fake-audio-capture=${path.resolve(`query/${name}.wav`)}`,
              '--autoplay-policy=no-user-gesture-required','--disable-blink-features=AutomationControlled','--no-sandbox'
            ]});
            const context=await browser.newContext({viewport:{width:1440,height:1100},locale:'en-US'});
            await context.grantPermissions(['microphone'],{origin:'https://www.doreso.com'});
            const page=await context.newPage(), log=[];
            page.on('console',m=>log.push({kind:'console',type:m.type(),text:m.text()}));
            page.on('pageerror',e=>log.push({kind:'pageerror',text:String(e)}));
            page.on('request',r=>{if(/api|hum|record|recogn|audio|upload|acr/i.test(r.url()))log.push({kind:'request',method:r.method(),url:r.url(),post:(r.postData()||'').slice(0,4000)})});
            page.on('response',async r=>{if(/api|hum|record|recogn|audio|upload|acr/i.test(r.url())){let body='';try{const ct=r.headers()['content-type']||'';if(/json|text/i.test(ct))body=(await r.text()).slice(0,50000)}catch(e){}log.push({kind:'response',status:r.status(),url:r.url(),body})}});
            try{
              await page.goto('https://www.doreso.com/',{waitUntil:'networkidle',timeout:90000});
              await page.waitForTimeout(2200);
              await page.getByRole('tab',{name:/HUM\/SING/i}).click({force:true});
              await page.waitForTimeout(700);
              const selected=await page.getByRole('tab',{name:/HUM\/SING/i}).getAttribute('aria-selected');
              log.push({kind:'mode-selected',selected});
              await page.locator('.rf-idle__ring').click({force:true,position:{x:52,y:52}});
              log.push({kind:'microphone-clicked'});
              await page.waitForTimeout(1200);
              await page.screenshot({path:`${dir}/01-after-click.png`,fullPage:true});
              for(let i=0;i<24;i++){
                await page.waitForTimeout(1500);
                const text=await page.locator('body').innerText();
                const html=await page.locator('section.app-area').innerHTML().catch(()=> '');
                log.push({kind:'state',sec:(i+1)*1.5,text:text.slice(0,12000),app:html.slice(0,15000)});
                if(i%4===3)await page.screenshot({path:`${dir}/state-${String(i+1).padStart(2,'0')}.png`,fullPage:true});
              }
              fs.writeFileSync(`${dir}/final.txt`,await page.locator('body').innerText());
              fs.writeFileSync(`${dir}/final.html`,await page.content());
              await page.screenshot({path:`${dir}/final.png`,fullPage:true});
            }catch(e){log.push({kind:'fatal',text:String(e),stack:e.stack});try{await page.screenshot({path:`${dir}/fatal.png`,fullPage:true})}catch(_){} }
            fs.writeFileSync(`${dir}/events.json`,JSON.stringify(log,null,2));
            await browser.close();
          }
          (async()=>{for(const v of variants)await one(v)})().catch(e=>{console.error(e);process.exit(1)});
          JS
          NODE_PATH="$PWD/node_modules" node /tmp/run.js | tee results/node.log
          find results -type f -printf '%p %s\n' | sort

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aha-synthetic-results-v2
          path: results
          retention-days: 1
