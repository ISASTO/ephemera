name: Temporary corrected AHA synthetic search

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Generate naturalized corrected melody queries
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install --quiet numpy
          mkdir -p query results
          cat > /tmp/synth.py <<'PY'
          import wave, numpy as np
          sr=44100
          # Corrected beat-synchronous transcription from the clean recording.
          times=np.array([0,.580499,1.213243,1.828572,2.426486,2.995375,3.593288,4.197007,4.754286,5.323175,5.961724,6.536418,7.082087,7.633560,8.161814])
          notes=np.array([85.2,85.1,83.4,92.8,84.9,84.95,83.4,92.8,85.4,85.2,83.5,92.5,90.4,91.5,88.1])

          def render(name, tnotes, pitches, tempo=1.0, semitones=0.0, hum=False):
              lead=.80; tt=lead+tnotes*tempo
              end=tt[-1]+1.0
              t=np.arange(int((end+3.2)*sr))/sr
              midi=np.empty_like(t)
              midi.fill(pitches[0]+semitones)
              # Hold each note, then glide during the final 90 ms into the next note.
              for i in range(len(tt)-1):
                  a,b=tt[i],tt[i+1]; glide=min(.095,(b-a)*.22); hold_end=b-glide
                  hold=(t>=a)&(t<hold_end); midi[hold]=pitches[i]+semitones
                  g=(t>=hold_end)&(t<b)
                  if g.any():
                      u=(t[g]-hold_end)/glide
                      u=u*u*(3-2*u)
                      midi[g]=(1-u)*(pitches[i]+semitones)+u*(pitches[i+1]+semitones)
              midi[t>=tt[-1]]=pitches[-1]+semitones
              freq=440*2**((midi-69)/12)
              vibrato=1+.0022*np.sin(2*np.pi*5.0*t)+.0007*np.sin(2*np.pi*7.3*t)
              phase=2*np.pi*np.cumsum(freq*vibrato)/sr
              if hum:
                  y=.50*np.sin(phase)+.22*np.sin(2*phase+.25)+.08*np.sin(3*phase+.55)
              else:
                  y=.62*np.sin(phase)+.10*np.sin(2*phase+.20)+.025*np.sin(3*phase+.4)
              env=np.zeros_like(t)
              env[(t>=lead-.08)&(t<=end)]=1
              # Natural micro-breaths at cycle boundaries without erasing note attacks.
              for boundary in [tt[4],tt[8],tt[12]]:
                  env*=1-.28*np.exp(-.5*((t-boundary)/.035)**2)
              env*=np.clip((t-(lead-.08))/.10,0,1)*np.clip((end-t)/.25,0,1)
              rng=np.random.default_rng(17)
              y=np.tanh(1.1*(y*env+.0025*rng.normal(size=len(t))*env))
              with wave.open(f'query/{name}.wav','wb') as wf:
                  wf.setnchannels(1);wf.setsampwidth(2);wf.setframerate(sr);wf.writeframes(np.int16(np.clip(y,-1,1)*32767).tobytes())

          render('corrected_whistle',times,notes,1.0,0,False)
          render('corrected_hum',times,notes,1.0,0,True)
          render('corrected_slow',times,notes,1.08,0,True)
          # Repeat the three-cycle skeleton twice, omitting the uncertain tail.
          skeleton_t=times[:12]
          gap=skeleton_t[-1]+.62
          loop_t=np.concatenate([skeleton_t,skeleton_t+gap])
          loop_n=np.concatenate([notes[:12],notes[:12]])
          render('three_cycles_twice',loop_t,loop_n,.94,0,True)
          # One-semitone-lower top notes tolerates slight whistle-octave/intensity bias.
          compressed=notes.copy();compressed[[3,7,11]]-=1
          render('compressed_highs',times,compressed,1.0,0,True)
          PY
          python /tmp/synth.py
          for f in query/*.wav; do ffprobe -v error -show_entries format=duration,size -of compact "$f"; done | tee results/query-info.txt

      - name: Install browser
        run: |
          npm init -y >/dev/null
          npm install --silent playwright
          npx playwright install --with-deps chromium

      - name: Search AHA humming catalog
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/run.js <<'JS'
          const { chromium }=require('playwright');
          const fs=require('fs'),path=require('path');
          const variants=['corrected_whistle','corrected_hum','corrected_slow','three_cycles_twice','compressed_highs'];
          const origin='https://www.doreso.com';fs.mkdirSync('results',{recursive:true});
          async function one(name){
            const dir=`results/${name}`;fs.mkdirSync(dir,{recursive:true});const log=[];
            const browser=await chromium.launch({headless:true,args:['--use-fake-ui-for-media-stream','--use-fake-device-for-media-stream',`--use-file-for-fake-audio-capture=${path.resolve(`query/${name}.wav`)}`,'--autoplay-policy=no-user-gesture-required','--disable-blink-features=AutomationControlled','--no-sandbox']});
            const ctx=await browser.newContext({viewport:{width:1440,height:1050},locale:'en-US',userAgent:'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/150 Safari/537.36'});await ctx.grantPermissions(['microphone'],{origin});const page=await ctx.newPage();
            page.on('response',async r=>{if(/api|hum|record|recogn|audio|upload|acr/i.test(r.url())){let body='';try{if(/json|text/i.test(r.headers()['content-type']||''))body=(await r.text()).slice(0,50000)}catch(_){}log.push({kind:'response',status:r.status(),url:r.url(),body})}});
            try{await page.goto(origin,{waitUntil:'networkidle',timeout:90000});await page.waitForTimeout(2000);await page.getByRole('tab',{name:/HUM\/SING/i}).click({force:true});await page.waitForTimeout(600);await page.locator('.rf-idle__ring').click({force:true,position:{x:50,y:50}});for(let i=0;i<26;i++){await page.waitForTimeout(1500);log.push({sec:(i+1)*1.5,text:(await page.locator('body').innerText()).slice(0,14000)});}fs.writeFileSync(`${dir}/final.txt`,await page.locator('body').innerText());await page.screenshot({path:`${dir}/final.png`,fullPage:true});}catch(e){log.push({fatal:String(e)});try{await page.screenshot({path:`${dir}/fatal.png`,fullPage:true})}catch(_){}}
            fs.writeFileSync(`${dir}/events.json`,JSON.stringify(log,null,2));await ctx.close();await browser.close();
          }
          (async()=>{for(const v of variants)await one(v)})().catch(e=>{console.error(e);process.exit(1)});
          JS
          NODE_PATH="$PWD/node_modules" node /tmp/run.js
          for f in results/*/final.txt; do echo "===== $f ====="; sed -n '1,30p' "$f"; done | tee results/summary.txt

      - name: Upload corrected synthetic recognition
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aha-corrected-synthetic-results
          path: results
          retention-days: 1
