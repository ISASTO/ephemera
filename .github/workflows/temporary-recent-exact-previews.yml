name: Temporary Suzy Sheer vocal verification

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install --quiet numpy demucs
      - name: Download exact Suzy Sheer previews
        shell: bash
        run: |
          set -euo pipefail
          mkdir previews
          curl -fL --retry 3 -o previews/blissed.mp3 'https://p.scdn.co/mp3-preview/631725522d651faec462e0d5afa41b5f6f182687.mp3'
          curl -fL --retry 3 -o previews/tell-me.mp3 'https://p.scdn.co/mp3-preview/23d7c7fac42880a01c633bc21bf9dcddcdcc14a9.mp3'
          curl -fL --retry 3 -o previews/days.mp3 'https://p.scdn.co/mp3-preview/111595a03e874ae2eb6e658c4a7af0a313fedb0a.mp3'
          curl -fL --retry 3 -o previews/no-surprise.mp3 'https://p.scdn.co/mp3-preview/b93e541c03a9275697d720bf2b08ed43037aa9d7.mp3'
          curl -fL --retry 3 -o previews/magic.mp3 'https://p.scdn.co/mp3-preview/37fbb7631ab45e96a1338c14389a5ffcf725f6c9.mp3'
      - name: Convert and isolate vocals
        shell: bash
        run: |
          set -euo pipefail
          mkdir wavs
          for file in previews/*.mp3; do
            base="$(basename "$file" .mp3)"
            ffmpeg -v error -y -i "$file" -ar 44100 -ac 2 "wavs/${base}.wav"
          done
          python -m demucs --two-stems=vocals -o separated wavs/*.wav
          mkdir vocal-stems
          find separated -type f -name vocals.wav -print0 | while IFS= read -r -d '' file; do
            track="$(basename "$(dirname "$file")")"
            cp "$file" "vocal-stems/${track}-vocals.wav"
          done
      - name: Upload Suzy vocals
        uses: actions/upload-artifact@v4
        with:
          name: suzy-sheer-vocals
          path: vocal-stems/*.wav
          retention-days: 1
