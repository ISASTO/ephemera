name: Temporary exact pre-history vocal check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install --quiet numpy demucs
      - name: Download exact previews
        run: |
          mkdir previews
          curl -fL --retry 3 -o previews/let-it-be.mp3 'https://p.scdn.co/mp3-preview/631084f5b7431d8bc1e7bf7a7402e64d2c91c3b6.mp3'
          curl -fL --retry 3 -o previews/fell-out-of-heaven.mp3 'https://p.scdn.co/mp3-preview/2b9dc8dbcd1887186d06ac6faf90317ce760507a.mp3'
          curl -fL --retry 3 -o previews/cry-cry-cry.mp3 'https://p.scdn.co/mp3-preview/daae519b2d5285cc28d8a7d95e8f70337cad9f94.mp3'
          curl -fL --retry 3 -o previews/soft-release.mp3 'https://p.scdn.co/mp3-preview/6a7a321dfa7b708e830c70bf0179b0c6721f4bac.mp3'
          curl -fL --retry 3 -o previews/other-turn.mp3 'https://p.scdn.co/mp3-preview/d21aab9bd69aa559c3fd76dc825adc75d9ca1816.mp3'
      - name: Isolate vocals
        run: |
          mkdir wavs
          for f in previews/*.mp3; do b=$(basename "$f" .mp3); ffmpeg -v error -y -i "$f" -ar 44100 -ac 2 "wavs/$b.wav"; done
          python -m demucs --two-stems=vocals -o separated wavs/*.wav
          mkdir vocal-stems
          find separated -type f -name vocals.wav -print0 | while IFS= read -r -d '' f; do b=$(basename "$(dirname "$f")"); cp "$f" "vocal-stems/$b-vocals.wav"; done
      - name: Upload vocals
        uses: actions/upload-artifact@v4
        with:
          name: exact-prehistory-vocals
          path: vocal-stems/*.wav
          retention-days: 1
