name: Temporary adjacent top vocal check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install --quiet numpy demucs
      - name: Resolve adjacent-catalog mathematical shortlist
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p previews metadata
          python - <<'PY'
          import json, pathlib, re, urllib.parse, urllib.request
          targets=[
            ('The Japanese House','Over There'),('Yumi Zouma','KPR (Redux)'),
            ('Wolf Alice','After the Zero Hour'),('Beach House','Levitation'),
            ('Men I Trust','Tailwhip'),('The Japanese House','You Always Get What You Want'),
            ('Purity Ring','MJ Odyssey'),('The Japanese House','You Seemed So Happy (LA Session)'),
            ('Weyes Blood','Be Free'),('Cults','Always Forever (Demo)'),
            ('Men I Trust','Poplar Tree'),('Yumi Zouma','Lonely After')]
          rows=[]
          for artist,title in targets:
            params=urllib.parse.urlencode({'term':f'{artist} {title}','entity':'song','limit':100,'country':'US'})
            req=urllib.request.Request('https://itunes.apple.com/search?'+params,headers={'User-Agent':'Mozilla/5.0'})
            with urllib.request.urlopen(req,timeout=40) as r:data=json.load(r)
            exact=[x for x in data.get('results',[]) if x.get('artistName','').casefold()==artist.casefold() and x.get('trackName','').casefold()==title.casefold() and x.get('previewUrl')]
            if not exact:
              # tolerate punctuation/session suffix differences, but require the target words in order
              norm=lambda s:re.sub(r'[^a-z0-9]+',' ',s.casefold()).strip()
              nt=norm(title)
              exact=[x for x in data.get('results',[]) if x.get('artistName','').casefold()==artist.casefold() and nt in norm(x.get('trackName','')) and x.get('previewUrl')]
            if not exact:
              print('NO EXACT',artist,title);continue
            x=exact[0];slug=re.sub(r'[^a-z0-9]+','-',f'{artist}-{title}'.casefold()).strip('-')[:100];fn=f'{slug}__{x.get("trackId")}.m4a'
            req=urllib.request.Request(x['previewUrl'],headers={'User-Agent':'Mozilla/5.0'})
            with urllib.request.urlopen(req,timeout=40) as src,open(pathlib.Path('previews')/fn,'wb') as dst:dst.write(src.read())
            rows.append({'artist':artist,'title':title,'resolved_title':x.get('trackName'),'filename':fn,'preview_url':x['previewUrl']})
            print('DOWNLOADED',artist,title,'AS',x.get('trackName'))
          pathlib.Path('metadata/targets.json').write_text(json.dumps(rows,indent=2,ensure_ascii=False),encoding='utf-8')
          PY
      - name: Convert and isolate vocals
        shell: bash
        run: |
          set -euo pipefail
          mkdir wavs
          for file in previews/*.m4a; do
            base="$(basename "$file" .m4a)"
            ffmpeg -v error -y -i "$file" -ar 44100 -ac 2 "wavs/${base}.wav"
          done
          python -m demucs --two-stems=vocals -o separated wavs/*.wav
          mkdir vocal-stems
          find separated -type f -name vocals.wav -print0 | while IFS= read -r -d '' file; do
            track="$(basename "$(dirname "$file")")"
            cp "$file" "vocal-stems/${track}-vocals.wav"
          done
      - name: Upload adjacent top vocals
        uses: actions/upload-artifact@v4
        with:
          name: adjacent-top-vocals
          path: |
            vocal-stems/*.wav
            metadata/targets.json
          retention-days: 1
