name: Temporary strict top-candidate vocal check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install --quiet numpy demucs
      - name: Download mathematically shortlisted previews
        shell: bash
        run: |
          set -euo pipefail
          mkdir previews
          curl -fL --retry 3 -o previews/crumb__vinta.m4a 'https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview211/v4/fb/61/d3/fb61d349-b237-7d8d-ee74-0616b5268926/mzaf_7892035487361193705.plus.aac.p.m4a'
          curl -fL --retry 3 -o previews/boygenius__letter-to-an-old-poet.m4a 'https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview211/v4/9f/3f/fc/9f3ffc41-031f-1d65-e6b5-654dcd6283b0/mzaf_202766263001818294.plus.aac.p.m4a'
          curl -fL --retry 3 -o previews/slow-pulp__gone-2.m4a 'https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview116/v4/60/07/2d/60072d68-8948-23b4-8ea4-79a3dd9e59de/mzaf_4552224382314776319.plus.aac.p.m4a'
          curl -fL --retry 3 -o previews/big-thief__promise-is-a-pendulum.m4a 'https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview116/v4/e6/a6/10/e6a61092-47f0-bb2f-dcec-b8136f7b9093/mzaf_17575704754232601927.plus.aac.p.m4a'
          curl -fL --retry 3 -o previews/slow-pulp__hanging-by-a-moment.m4a 'https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview211/v4/2c/80/07/2c8007d4-0ff8-ae04-1fef-b9c031e99c63/mzaf_11076186937941406719.plus.aac.p.m4a'
          curl -fL --retry 3 -o previews/fazerdaze__city-glitter.m4a 'https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview211/v4/a1/42/d6/a142d655-2471-40c0-5cdb-3b009ee01f0d/mzaf_10855333555805606929.plus.aac.p.m4a'
          curl -fL --retry 3 -o previews/mitski__cop-car.m4a 'https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview125/v4/3a/2a/bf/3a2abf56-a065-31dd-b4b3-d7d5479ceb9e/mzaf_12729860694073216978.plus.aac.p.m4a'
          curl -fL --retry 3 -o previews/blondshell__kiss-city-home-demo.m4a 'https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview221/v4/9c/43/23/9c4323b6-1de0-b3f4-ce5c-d9085ae48d12/mzaf_8468887218707486193.plus.aac.p.m4a'
          curl -fL --retry 3 -o previews/fazerdaze__somethink.m4a 'https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview125/v4/6f/97/a1/6f97a179-2029-c192-8e49-c3e33c2e838e/mzaf_13167615808912379651.plus.aac.p.m4a'
          curl -fL --retry 3 -o previews/still-corners__the-white-season.m4a 'https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview115/v4/a0/0e/ca/a00eca99-e5de-e3de-f120-0a9c5649d823/mzaf_13841424727922900743.plus.aac.p.m4a'
          curl -fL --retry 3 -o previews/alvvays__saved-by-a-waif.m4a 'https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview116/v4/b0/60/1c/b0601c29-f30b-16db-9763-a319709b2846/mzaf_10251772534450839615.plus.aac.p.m4a'
          curl -fL --retry 3 -o previews/fazerdaze__sleeper.m4a 'https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview221/v4/3b/78/31/3b783101-63e6-371e-7dba-de0c68517936/mzaf_13916199662797122114.plus.aac.p.m4a'
      - name: Convert and isolate vocals
        shell: bash
        run: |
          set -euo pipefail
          mkdir wavs
          for file in previews/*.m4a; do
            base="$(basename "$file" .m4a)"
            ffmpeg -v error -y -i "$file" -ar 44100 -ac 2 "wavs/${base}.wav"
          done
          python -m demucs --two-stems=vocals -o separated wavs/*.wav
          mkdir vocal-stems
          find separated -type f -name vocals.wav -print0 | while IFS= read -r -d '' file; do
            track="$(basename "$(dirname "$file")")"
            cp "$file" "vocal-stems/${track}-vocals.wav"
          done
      - name: Upload strict candidate vocals
        uses: actions/upload-artifact@v4
        with:
          name: strict-top-candidate-vocals
          path: vocal-stems/*.wav
          retention-days: 1
