name: Temporary refined top-candidate vocal check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install --quiet numpy demucs
      - name: Download refined mathematical shortlist
        shell: bash
        run: |
          set -euo pipefail
          mkdir previews
          curl -fL --retry 3 -o previews/mitski__door.m4a 'https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview122/v4/b1/97/20/b1972055-b518-b446-f809-5c9c86cb7a7f/mzaf_17222863943823666237.plus.aac.p.m4a'
          curl -fL --retry 3 -o previews/slow-pulp__slugs.m4a 'https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview116/v4/47/8c/27/478c275f-7270-4225-d092-1fcea187f4e4/mzaf_9725650515252973770.plus.aac.p.m4a'
          curl -fL --retry 3 -o previews/big-thief__mary.m4a 'https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview221/v4/7e/d2/78/7ed2782b-9d0d-6ed5-888f-ac33e6b88f70/mzaf_1228150362771723137.plus.aac.p.m4a'
          curl -fL --retry 3 -o previews/mitski__in-a-lake.m4a 'https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview221/v4/62/63/d1/6263d15b-d080-cbac-774c-3f092b733f54/mzaf_17706781318209920540.plus.aac.p.m4a'
          curl -fL --retry 3 -o previews/tops__driverless-passenger.m4a 'https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview125/v4/51/71/f4/5171f483-3c16-daf3-b5ae-1863fcc4a921/mzaf_3653542569092668683.plus.aac.p.m4a'
          curl -fL --retry 3 -o previews/blondshell__two-times.m4a 'https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview211/v4/09/a7/8c/09a78c01-e49b-9c83-31dd-c2a856a4a245/mzaf_13676318678813336498.plus.aac.p.m4a'
          curl -fL --retry 3 -o previews/warpaint__baby.m4a 'https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview125/v4/67/59/b9/6759b99e-2f36-2a26-6252-fe54f466be70/mzaf_13294442781468417526.plus.aac.p.m4a'
          curl -fL --retry 3 -o previews/big-thief__simulation-swarm.m4a 'https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview116/v4/56/1d/e1/561de1dd-a7ca-f053-9c08-15023dd15741/mzaf_13452211018978895983.plus.aac.p.m4a'
          curl -fL --retry 3 -o previews/warpaint__son.m4a 'https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview125/v4/cb/0b/69/cb0b69fe-147d-960e-b37f-f91896faf1d7/mzaf_859659317384308640.plus.aac.p.m4a'
          curl -fL --retry 3 -o previews/yeah-yeah-yeahs__maps-itunes-originals.m4a 'https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview211/v4/55/6b/82/556b827c-2f80-d607-7b9b-c048503ab54f/mzaf_4628321494093715977.plus.aac.p.m4a'
          curl -fL --retry 3 -o previews/tops__too-much.m4a 'https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview211/v4/76/6f/65/766f65f9-9c60-1e55-e95e-59bf9fcff12e/mzaf_973909424870627476.plus.aac.p.m4a'
          curl -fL --retry 3 -o previews/momma__motorbike.m4a 'https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview211/v4/72/3a/58/723a5803-a52d-da9e-8644-5884d5554b6b/mzaf_7024459212299705661.plus.aac.p.m4a'
      - name: Convert and isolate vocals
        shell: bash
        run: |
          set -euo pipefail
          mkdir wavs
          for file in previews/*.m4a; do
            base="$(basename "$file" .m4a)"
            ffmpeg -v error -y -i "$file" -ar 44100 -ac 2 "wavs/${base}.wav"
          done
          python -m demucs --two-stems=vocals -o separated wavs/*.wav
          mkdir vocal-stems
          find separated -type f -name vocals.wav -print0 | while IFS= read -r -d '' file; do
            track="$(basename "$(dirname "$file")")"
            cp "$file" "vocal-stems/${track}-vocals.wav"
          done
      - name: Upload refined candidate vocals
        uses: actions/upload-artifact@v4
        with:
          name: refined-top-candidate-vocals
          path: vocal-stems/*.wav
          retention-days: 1
