name: Run SoundHound Android emulator

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - name: Download SoundHound APK and prepare evidence directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          curl -fL --retry 5 -o soundhound.apk 'https://pool.apk.aptoide.com/appupdater/com-melodis-midomimusicidentifier-freemium-21133-75493638-ea8ef004991c8e5e3e992b141645ec70.apk'
          sha256sum soundhound.apk | tee evidence/apk_sha256.txt
          test "$(stat -c%s soundhound.apk)" -gt 50000000

      - name: Boot emulator, install, and inspect app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          cores: 2
          ram-size: 3072M
          heap-size: 768M
          disable-animations: true
          script: |
            set -euxo pipefail
            adb wait-for-device
            adb shell getprop ro.build.version.release | tee evidence/android_version.txt
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            adb install -r -g soundhound.apk | tee evidence/install.txt
            adb shell pm grant com.melodis.midomiMusicIdentifier.freemium android.permission.RECORD_AUDIO || true
            adb shell pm grant com.melodis.midomiMusicIdentifier.freemium android.permission.POST_NOTIFICATIONS || true
            adb shell cmd appops set com.melodis.midomiMusicIdentifier.freemium RECORD_AUDIO allow || true
            adb shell am force-stop com.melodis.midomiMusicIdentifier.freemium
            adb shell am start -W -n com.melodis.midomiMusicIdentifier.freemium/com.soundhound.android.appcommon.activity.SoundHound | tee evidence/start.txt
            sleep 15
            adb exec-out screencap -p > evidence/01-launch.png
            adb shell uiautomator dump /sdcard/01.xml || true
            adb pull /sdcard/01.xml evidence/01.xml || true
            adb shell dumpsys activity activities > evidence/activities.txt
            adb shell dumpsys package com.melodis.midomiMusicIdentifier.freemium > evidence/package.txt
            adb shell logcat -d -v threadtime > evidence/logcat-launch.txt

            # Tap likely onboarding controls and the large central recognition button, saving every state.
            for spec in '540 1850 bottom' '540 1700 lower' '540 950 center' '540 600 upper'; do
              set -- $spec; x=$1; y=$2; name=$3
              adb shell input tap "$x" "$y" || true
              sleep 6
              adb exec-out screencap -p > "evidence/state-${name}.png"
              adb shell uiautomator dump "/sdcard/state-${name}.xml" || true
              adb pull "/sdcard/state-${name}.xml" "evidence/state-${name}.xml" || true
            done
            adb shell logcat -d -v threadtime > evidence/logcat-after-taps.txt
            adb shell dumpsys window windows > evidence/windows.txt
            find evidence -type f -printf '%p %s\n' | sort | tee evidence/files.txt

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soundhound-emulator-launch
          path: evidence
          retention-days: 1
