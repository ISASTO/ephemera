name: Run SoundHound Android emulator

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download SoundHound APK and prepare evidence directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          curl -fL --retry 5 -o soundhound.apk 'https://pool.apk.aptoide.com/appupdater/com-melodis-midomimusicidentifier-freemium-21133-75493638-ea8ef004991c8e5e3e992b141645ec70.apk'
          sha256sum soundhound.apk | tee evidence/apk_sha256.txt
          test "$(stat -c%s soundhound.apk)" -gt 50000000

      - name: Boot emulator, install, and inspect app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          heap-size: 1024M
          disk-size: 8192M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none -camera-front none -no-audio
          disable-animations: true
          script: |
            set -euo pipefail
            adb wait-for-device
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            adb install -r -g soundhound.apk | tee evidence/install.txt
            adb shell pm grant com.melodis.midomiMusicIdentifier.freemium android.permission.RECORD_AUDIO || true
            adb shell pm grant com.melodis.midomiMusicIdentifier.freemium android.permission.POST_NOTIFICATIONS || true
            adb shell cmd appops set com.melodis.midomiMusicIdentifier.freemium RECORD_AUDIO allow || true
            adb shell am force-stop com.melodis.midomiMusicIdentifier.freemium
            adb shell am start -W -n com.melodis.midomiMusicIdentifier.freemium/com.soundhound.android.appcommon.activity.SoundHound | tee evidence/start.txt
            sleep 12
            adb exec-out screencap -p > evidence/01-launch.png
            adb shell uiautomator dump /sdcard/01.xml >/dev/null || true
            adb pull /sdcard/01.xml evidence/01.xml >/dev/null || true
            adb shell dumpsys activity activities > evidence/activities.txt
            adb shell dumpsys package com.melodis.midomiMusicIdentifier.freemium > evidence/package.txt
            adb shell logcat -d -v threadtime > evidence/logcat-launch.txt

            # Dismiss common onboarding and consent surfaces by text where present.
            for text in 'ACCEPT' 'Accept' 'AGREE' 'Agree' 'CONTINUE' 'Continue' 'NEXT' 'Next' 'NOT NOW' 'Not now' 'SKIP' 'Skip' 'ALLOW' 'Allow'; do
              adb shell input text "$text" >/dev/null 2>&1 || true
            done
            # Try center-bottom and center-screen, then capture each resulting state.
            adb shell input tap 540 1850 || true
            sleep 4
            adb exec-out screencap -p > evidence/02-bottom-tap.png
            adb shell uiautomator dump /sdcard/02.xml >/dev/null || true
            adb pull /sdcard/02.xml evidence/02.xml >/dev/null || true
            adb shell input tap 540 950 || true
            sleep 8
            adb exec-out screencap -p > evidence/03-center-tap.png
            adb shell uiautomator dump /sdcard/03.xml >/dev/null || true
            adb pull /sdcard/03.xml evidence/03.xml >/dev/null || true
            adb shell logcat -d -v threadtime > evidence/logcat-after-taps.txt
            adb shell dumpsys window windows > evidence/windows.txt
            find evidence -type f -printf '%p %s\n' | sort | tee evidence/files.txt

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soundhound-emulator-launch
          path: evidence
          retention-days: 1
