name: Temporary expanded top vocal verification

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install --quiet numpy demucs
      - name: Download expanded-catalog top previews
        shell: bash
        run: |
          set -euo pipefail
          mkdir previews
          curl -fL --retry 3 -o previews/lana-del-rey__beautiful.m4a 'https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview116/v4/e0/e8/c0/e0e8c03d-6a29-2114-4aa0-3d143f8c9e1b/mzaf_17751327738987684187.plus.aac.p.m4a'
          curl -fL --retry 3 -o previews/metric__calculation-theme.m4a 'https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview115/v4/a0/09/99/a009998a-04b5-5e8b-55cb-f5feae238a70/mzaf_16094605379192449207.plus.aac.p.m4a'
          curl -fL --retry 3 -o previews/lana-del-rey__not-all-who-wander.m4a 'https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview124/v4/c0/6c/ad/c06cadf5-94aa-9a42-2425-47977f4cb459/mzaf_309220877555135661.plus.aac.p.m4a'
          curl -fL --retry 3 -o previews/london-grammar__call-your-friends.m4a 'https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview211/v4/34/a9/bb/34a9bb8a-3bb8-5ceb-4eba-5d7b196c6ff0/mzaf_6339799469980933171.plus.aac.p.m4a'
          curl -fL --retry 3 -o previews/beabadoobee__girl-song.m4a 'https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview211/v4/d7/6b/00/d76b0079-b877-16fd-691d-e50b02d900f0/mzaf_9693221626727852105.plus.aac.p.m4a'
          curl -fL --retry 3 -o previews/lana-del-rey__candy-necklace.m4a 'https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview211/v4/e3/d7/cc/e3d7ccca-a4f1-9489-bf60-d24209337931/mzaf_14813441244286008932.plus.aac.p.m4a'
          curl -fL --retry 3 -o previews/boa__duvet-acoustic.m4a 'https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview211/v4/7a/25/a0/7a25a0e3-66fc-d2f2-6797-01bf996dc960/mzaf_17760112228778885343.plus.aac.p.m4a'
          curl -fL --retry 3 -o previews/chromatics__moment-to-remember.m4a 'https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview115/v4/7f/f3/34/7ff3341d-8be7-6f31-48c8-a299e9526f09/mzaf_6565168631826394461.plus.aac.p.m4a'
          curl -fL --retry 3 -o previews/the-sundays__your-eyes.m4a 'https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview115/v4/cd/73/07/cd730759-91ad-9f58-417a-8ccd613fd5fc/mzaf_17328707034533387758.plus.aac.p.m4a'
          curl -fL --retry 3 -o previews/beach-bunny__boys-live.m4a 'https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview211/v4/b2/29/80/b2298049-4ead-01ae-e5fc-829c7e280076/mzaf_3946366282101449809.plus.aac.p.m4a'
          curl -fL --retry 3 -o previews/beach-bunny__karaoke.m4a 'https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview221/v4/ca/5c/94/ca5c946c-49c2-5de8-e12b-ca5704332445/mzaf_12787462848110862901.plus.aac.p.m4a'
          curl -fL --retry 3 -o previews/cocteau-twins__alice.m4a 'https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview115/v4/04/f9/39/04f9390b-e494-5cd6-4745-9a8cdcf98846/mzaf_18438401313398837512.plus.aac.p.m4a'
      - name: Convert and isolate vocals
        shell: bash
        run: |
          set -euo pipefail
          mkdir wavs
          for file in previews/*.m4a; do
            base="$(basename "$file" .m4a)"
            ffmpeg -v error -y -i "$file" -ar 44100 -ac 2 "wavs/${base}.wav"
          done
          python -m demucs --two-stems=vocals -o separated wavs/*.wav
          mkdir vocal-stems
          find separated -type f -name vocals.wav -print0 | while IFS= read -r -d '' file; do
            track="$(basename "$(dirname "$file")")"
            cp "$file" "vocal-stems/${track}-vocals.wav"
          done
      - name: Upload expanded top vocals
        uses: actions/upload-artifact@v4
        with:
          name: expanded-top-vocals
          path: vocal-stems/*.wav
          retention-days: 1
