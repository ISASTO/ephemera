name: Temporary top-candidate transcription

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  transcribe:
    runs-on: ubuntu-latest
    steps:
      - name: Install audio and transcription tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install --quiet openai-whisper
      - name: Download candidate previews
        run: |
          mkdir previews wavs transcripts
          curl -fL --retry 3 -o previews/deadbeat.m4a 'https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview221/v4/73/09/c0/7309c055-91a1-c417-3d9d-c833bd2b8f2d/mzaf_48593663521120636.plus.aac.p.m4a'
          curl -fL --retry 3 -o previews/why-do-you-love-me.m4a 'https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview126/v4/a5/d1/cf/a5d1cf0a-6aff-ba95-2bfa-7dc6a74b7192/mzaf_3402559521193919450.plus.aac.p.m4a'
          curl -fL --retry 3 -o previews/23.m4a 'https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview125/v4/af/23/b6/af23b6f8-9fd8-fd56-ca5a-ab626ebf042f/mzaf_11459024933205851920.plus.aac.p.m4a'
          curl -fL --retry 3 -o previews/magic.m4a 'https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview126/v4/2d/08/5a/2d085a2b-3c9c-9339-c44c-1c77183c5d10/mzaf_18369090501005989842.plus.aac.p.m4a'
          curl -fL --retry 3 -o previews/blissed.m4a 'https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview126/v4/5e/7f/22/5e7f220b-81af-1513-eada-52a5e4e50db8/mzaf_469594456338537098.plus.aac.p.m4a'
          for f in previews/*.m4a; do b=$(basename "$f" .m4a); ffmpeg -v error -y -i "$f" -ar 16000 -ac 1 "wavs/$b.wav"; done
      - name: Transcribe previews
        run: |
          whisper wavs/*.wav --model tiny.en --language English --task transcribe --output_dir transcripts --output_format all --fp16 False
          for f in transcripts/*.txt; do echo "--- $f"; cat "$f"; done
      - name: Upload transcripts
        uses: actions/upload-artifact@v4
        with:
          name: top-candidate-transcripts
          path: transcripts
          retention-days: 1
