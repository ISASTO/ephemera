name: Temporary DALI Zenodo inspection

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect DALI Zenodo release
        shell: bash
        run: |
          set -euo pipefail
          mkdir results
          curl -fLsS 'https://zenodo.org/api/records/2577915' -o results/record.json
          python - <<'PY'
          import json, pathlib
          d=json.load(open('results/record.json'))
          print('title',d.get('metadata',{}).get('title'))
          lines=[]
          for f in d.get('files',[]):
              links=f.get('links',{})
              row={
                  'key':f.get('key'),
                  'size':f.get('size'),
                  'checksum':f.get('checksum'),
                  'self':links.get('self'),
                  'download':links.get('content') or links.get('self')
              }
              lines.append(row)
              print(row)
          pathlib.Path('results/files.json').write_text(json.dumps(lines,indent=2),encoding='utf-8')
          pathlib.Path('results/files.tsv').write_text('\n'.join(f"{x['size']}\t{x['key']}\t{x['download']}" for x in lines),encoding='utf-8')
          PY
          cat results/files.tsv
      - name: Upload Zenodo inspection
        uses: actions/upload-artifact@v4
        with:
          name: dali-zenodo-inspection
          path: results
          retention-days: 1
